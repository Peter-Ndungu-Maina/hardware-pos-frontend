<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/src/pages/auth.js" data-roles="admin,manager"></script>
    <script src="/src/pages/sidebar.js" data-active="stock_audit.html"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Audit Statement | Elite Hardware</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="antialiased bg-[#0a0f1e]">

   <div class="flex min-h-screen">
        <div id="sidebarMount"></div>
        <main class="flex-1 p-4 md:p-8 h-screen overflow-y-auto custom-scrollbar bg-slate-50">
            
            <div class="max-w-7xl mx-auto">
                <header class="mb-8 flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                    <div>
                        <h1 class="text-4xl font-black text-slate-900 tracking-tighter uppercase">Stock Audit Statement</h1>
                        <p class="text-slate-500 font-bold mt-2">Comprehensive ledger of all stock movements, write-offs, and adjustments.</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="exportCSV()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm uppercase tracking-wide transition-colors">
                            ↓ CSV
                        </button>
                        <button onclick="exportPDF()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-black rounded-xl text-sm uppercase tracking-wide transition-colors">
                            ↓ PDF
                        </button>
                    </div>
                </header>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Search Item / Ref</label>
                        <input type="text" id="auditSearch" placeholder="E.g. Cement, DN-102..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-emerald-500">
                    </div>
                    <div class="w-full md:w-auto">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Action Type</label>
                        <select id="filterAction" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-emerald-500">
                            <option value="">All Actions</option>
                            <option value="INITIAL_STOCK">Stock Registration</option>
                            <option value="RESTOCK">Restock / Additions</option>
                            <option value="STOCK_WRITEOFF">Write-offs (Damage/Theft)</option>
                            <option value="EXCHANGE">Returns / Exchanges</option>
                            <option value="MANUAL_INVENTORY_EDIT">Manual Edits</option>
                        </select>
                    </div>
                    <div class="w-full md:w-auto">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Period</label>
                        <select id="quickDate" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-emerald-500">
                            <option value="all">All Time</option>
                            <option value="today">Today</option>
                            <option value="month">This Month</option>
                            <option value="year">This Year</option>
                            <option value="custom">Custom Range ➔</option>
                        </select>
                    </div>
                    <div class="w-full md:w-auto">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Date From</label>
                        <input type="date" id="filterFrom" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-emerald-500 disabled:opacity-50" disabled>
                    </div>
                    <div class="w-full md:w-auto">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Date To</label>
                        <input type="date" id="filterTo" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 ring-emerald-500 disabled:opacity-50" disabled>
                    </div>
                </div>

               <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest">
                                <tr>
                                    <th class="p-4 whitespace-nowrap">Timestamp</th>
                                    <th class="p-4">Action</th>
                                    <th class="p-4 min-w-[200px]">Item & Details</th>
                                    <th class="p-4">Reference</th>
                                    <th class="p-4 text-center">User</th>
                                    <th class="p-4 text-right">Movement</th>
                                </tr>
                            </thead>
                            <tbody id="auditLogBody" class="divide-y divide-slate-100 text-slate-700 font-medium text-xs">
                            </tbody>
                        </table>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-slate-50 border-t border-slate-200">
                        <span id="lbl_sa" class="text-[10px] font-black text-slate-500 uppercase tracking-widest font-mono"></span>
                        <div class="flex gap-2">
                            <button id="prev_sa" onclick="pg_sa(-1)" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 disabled:opacity-50 transition-all hover:bg-slate-100">← Prev</button>
                            <button id="next_sa" onclick="pg_sa(1)" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-600 disabled:opacity-50 transition-all hover:bg-slate-100">Next →</button>
                        </div>
                    </div>
                    <div id="loadingState" class="p-20 text-center text-slate-400 font-black uppercase text-xs">
                        Loading Audit Data...
                    </div>
                </div>
            </div>
        </main>
    </div>

<script>
const API_URL = window.API_URL || 'https://hardware-pos-backend.onrender.com/api';

let _allLogs = [];
let _filteredLogs = [];
let _pg_sa_page = 1;
const PER_PAGE = 20;

async function loadAuditLogs() {
    try {
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('auditLogBody').innerHTML = '';
        
        const res = await window.apiFetch(`${API_URL}/inventory/audit-logs`);
        if (!res || !res.ok) throw new Error(`Server error: ${res ? res.status : "no response"}`);

        const _data = await res.json();
        _allLogs = Array.isArray(_data) ? _data : [];
        
        applyFilters();
    } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('auditLogBody').innerHTML = `<tr><td colspan="6" class="p-10 text-center text-red-500 font-black">Error loading logs</td></tr>`;
    }
}

function handleQuickDateChange() {
    const quickDate = document.getElementById('quickDate').value;
    const fromInput = document.getElementById('filterFrom');
    const toInput = document.getElementById('filterTo');
    
    const today = new Date();
    
    if (quickDate === 'custom') {
        fromInput.disabled = false;
        toInput.disabled = false;
        return; // Don't auto-apply yet, let user pick dates
    } else {
        fromInput.disabled = true;
        toInput.disabled = true;
    }

    if (quickDate === 'today') {
        fromInput.value = today.toISOString().split('T')[0];
        toInput.value = today.toISOString().split('T')[0];
    } else if (quickDate === 'month') {
        fromInput.value = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        toInput.value = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
    } else if (quickDate === 'year') {
        fromInput.value = new Date(today.getFullYear(), 0, 1).toISOString().split('T')[0];
        toInput.value = new Date(today.getFullYear(), 11, 31).toISOString().split('T')[0];
    } else {
        fromInput.value = '';
        toInput.value = '';
    }
    
    applyFilters();
}

function applyFilters() {
    const search = document.getElementById('auditSearch').value.toLowerCase();
    const action = document.getElementById('filterAction').value;
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    _filteredLogs = _allLogs.filter(log => {
        // Search Filter
        const matchesSearch = !search || 
            (log.Inventory?.item_name || '').toLowerCase().includes(search) || 
            (log.delivery_number || '').toLowerCase().includes(search) ||
            (log.details || '').toLowerCase().includes(search);
            
        // Action Filter
        let matchesAction = true;
        if (action === 'RESTOCK') {
            matchesAction = ['RESTOCK', 'RESTOCK_FIFO', 'BULK_RESTOCK'].includes(log.action);
        } else if (action === 'STOCK_WRITEOFF') {
            matchesAction = ['STOCK_WRITEOFF', 'DAMAGE_WRITEOFF'].includes(log.action);
        } else if (action === 'EXCHANGE') {
            matchesAction = ['EXCHANGE_IN', 'EXCHANGE_OUT', 'SUPPLIER_RETURN', 'SUPPLIER_RETURN_PENDING'].includes(log.action);
        } else if (action !== '') {
            matchesAction = log.action === action;
        }

        // Date Filter
        const logDate = new Date(log.created_at).toISOString().split('T')[0];
        const matchesFrom = !from || logDate >= from;
        const matchesTo = !to || logDate <= to;

        return matchesSearch && matchesAction && matchesFrom && matchesTo;
    });

    _pg_sa_page = 1;
    _pg_sa_draw();
}

function _pg_sa_draw() {
    const total = _filteredLogs.length;
    const pages = Math.ceil(total / PER_PAGE) || 1;
    const slice = _filteredLogs.slice((_pg_sa_page - 1) * PER_PAGE, _pg_sa_page * PER_PAGE);
    
    document.getElementById('lbl_sa').textContent = `Page ${_pg_sa_page} of ${pages} — ${total} record(s)`;
    document.getElementById('prev_sa').disabled = _pg_sa_page <= 1;
    document.getElementById('next_sa').disabled = _pg_sa_page >= pages;
    
    _sa_renderRows(slice);
}

function pg_sa(dir) {
    const pages = Math.ceil(_filteredLogs.length / PER_PAGE) || 1;
    _pg_sa_page = Math.max(1, Math.min(pages, _pg_sa_page + dir));
    _pg_sa_draw();
}

function formatActionBadge(action) {
    const map = {
        'INITIAL_STOCK':         { label: 'Registered', color: 'bg-emerald-100 text-emerald-700' },
        'RESTOCK_FIFO':          { label: 'Restock',    color: 'bg-blue-100 text-blue-700' },
        'RESTOCK':               { label: 'Restock',    color: 'bg-blue-100 text-blue-700' },
        'BULK_RESTOCK':          { label: 'Bulk Add',   color: 'bg-indigo-100 text-indigo-700' },
        'MANUAL_INVENTORY_EDIT': { label: 'Manual Edit',color: 'bg-slate-200 text-slate-700' },
        'STOCK_WRITEOFF':        { label: 'Write-off',  color: 'bg-red-100 text-red-700' },
        'DAMAGE_WRITEOFF':       { label: 'Damaged',    color: 'bg-orange-100 text-orange-700' },
        'EXCHANGE_IN':           { label: 'Return In',  color: 'bg-teal-100 text-teal-700' },
        'EXCHANGE_OUT':          { label: 'Replace Out',color: 'bg-rose-100 text-rose-700' },
        'SUPPLIER_RETURN':       { label: 'Sup. Return',color: 'bg-purple-100 text-purple-700' }
    };
    const info = map[action] || { label: action, color: 'bg-slate-100 text-slate-600' };
    return `<span class="${info.color} px-2 py-1 rounded-[6px] text-[9px] font-black uppercase tracking-wider">${info.label}</span>`;
}

function _sa_renderRows(logs) {
    const body = document.getElementById('auditLogBody');
    document.getElementById('loadingState').classList.add('hidden');

    if (!logs || logs.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="p-16 text-center text-slate-400 font-bold uppercase text-xs tracking-widest">No matching records.</td></tr>`;
        return;
    }

    body.innerHTML = logs.map(log => {
        const dt = new Date(log.created_at);
        const oldStock = parseInt(log.stock_at_entry) || 0;
        const newStock = parseInt(log.new_stock) || 0;
        const addedQty = parseInt(log.batch_qty) || 0;

        const moveColor = addedQty > 0 ? 'text-emerald-500' : (addedQty < 0 ? 'text-red-500' : 'text-slate-400');
        const sign = addedQty > 0 ? '+' : '';

        return `
            <tr class="hover:bg-slate-50/80 transition-colors group">
                <td class="p-4">
                    <div class="flex flex-col">
                        <span class="text-slate-900 font-black text-[10px] uppercase">${dt.toLocaleDateString('en-KE')}</span>
                        <span class="text-slate-400 text-[9px] font-bold">${dt.toLocaleTimeString('en-KE')}</span>
                    </div>
                </td>
                <td class="p-4">
                    ${formatActionBadge(log.action)}
                </td>
                <td class="p-4">
                    <p class="font-black text-slate-800 uppercase text-xs mb-0.5">${log.Inventory?.item_name || 'Deleted Item'}</p>
                    <p class="text-[10px] text-slate-500 leading-tight max-w-sm line-clamp-2 group-hover:line-clamp-none" title="${log.details || ''}">${log.details || ''}</p>
                </td>
                <td class="p-4">
                    <span class="text-[11px] text-slate-600 font-mono bg-slate-100 px-1.5 py-0.5 rounded">${log.delivery_number || '—'}</span>
                </td>
                <td class="p-4 text-center">
                    <span class="text-[10px] font-black text-slate-600 uppercase border border-slate-200 px-2 py-1 rounded">
                        ${log.performed_by || 'SYSTEM'}
                    </span>
                </td>
                <td class="p-4 text-right font-mono">
                    <div class="flex flex-col items-end">
                        <div class="text-[10px] text-slate-400 mb-0.5">Bal: <span class="font-bold text-slate-600">${newStock}</span></div>
                        <div class="text-xs font-black ${moveColor} bg-white border border-slate-100 px-1.5 rounded shadow-sm">
                            ${sign}${addedQty}
                        </div>
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// ── Export Functions ──────────────────────────────────────────

function exportCSV() {
    if (!_filteredLogs.length) return alert("No data to export based on current filters.");

    let csvContent = "Date,Time,User,Action,Item Name,Reference/DN,Old Stock,Qty Changed,New Balance,Details\n";
    
    _filteredLogs.forEach(log => {
        const dt = new Date(log.created_at);
        const date = dt.toLocaleDateString('en-KE');
        const time = dt.toLocaleTimeString('en-KE');
        
        const user = `"${(log.performed_by || 'SYSTEM').replace(/"/g, '""')}"`;
        const action = `"${(log.action || '').replace(/"/g, '""')}"`;
        const item = `"${(log.Inventory?.item_name || '').replace(/"/g, '""')}"`;
        const ref = `"${(log.delivery_number || '').replace(/"/g, '""')}"`;
        const details = `"${(log.details || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`;
        
        const oldStock = log.stock_at_entry || 0;
        const change = log.batch_qty || 0;
        const newStock = log.new_stock || 0;

        csvContent += `${date},${time},${user},${action},${item},${ref},${oldStock},${change},${newStock},${details}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Stock_Audit_Statement_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exportPDF() {
    if (!_filteredLogs.length) return alert("No data to export based on current filters.");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('landscape', 'pt', 'a4');
    
    // --- ELITE HW LOGO (Stylized Text Box) ---
    // Note: To use an actual image, uncomment the following line and provide your Base64 PNG:
    // doc.addImage('data:image/png;base64,...', 'PNG', 40, 30, 80, 25);
    
    // Default stylised text logo
    doc.setFillColor(15, 23, 42); // slate-900 background
    doc.rect(40, 30, 95, 28, 'F');
    doc.setTextColor(0, 229, 160); // emerald-400 text
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("ELITE HW", 48, 49);
    // -----------------------------------------

    // Header Text
    doc.setTextColor(15, 23, 42);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("Stock Audit Statement", 40, 90);
    
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(100);
    
    // Describe the period based on filters
    const filterFrom = document.getElementById('filterFrom').value;
    const filterTo = document.getElementById('filterTo').value;
    let periodText = "All Time";
    if (filterFrom && filterTo) periodText = `${filterFrom} to ${filterTo}`;
    else if (filterFrom) periodText = `From ${filterFrom}`;
    else if (filterTo) periodText = `Until ${filterTo}`;

    doc.text(`Period: ${periodText} | Generated: ${new Date().toLocaleString('en-KE')}`, 40, 108);

    // Prepare Table Data
    const tableData = _filteredLogs.map(log => [
        new Date(log.created_at).toLocaleString('en-KE', { dateStyle: 'short', timeStyle: 'short' }),
        log.performed_by || 'SYSTEM',
        log.action ? log.action.replace(/_/g, ' ') : '-',
        log.Inventory?.item_name || 'Deleted Item',
        log.delivery_number || '-',
        (log.batch_qty > 0 ? '+' : '') + (log.batch_qty || 0),
        log.new_stock || 0,
        (log.details || '').substring(0, 100) // Truncate details slightly for PDF fit
    ]);

    doc.autoTable({
        startY: 125, // Adjusted down to fit the logo
        head: [['Date/Time', 'User', 'Action', 'Item Name', 'Reference', 'Change', 'Bal', 'Details']],
        body: tableData,
        theme: 'grid',
        styles: { fontSize: 8, cellPadding: 4 },
        headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
        columnStyles: {
            0: { cellWidth: 80 },
            2: { cellWidth: 70 },
            4: { cellWidth: 60 },
            5: { halign: 'right', cellWidth: 40 },
            6: { halign: 'right', cellWidth: 40, fontStyle: 'bold' },
            7: { cellWidth: 'auto' } // Details takes remaining space
        },
        alternateRowStyles: { fillColor: [248, 250, 252] }
    });

    doc.save(`Stock_Audit_Statement_${new Date().toISOString().split('T')[0]}.pdf`);
}

// Event Listeners — filter controls wired on DOM ready
window.addEventListener('load', () => {
    document.getElementById('auditSearch').addEventListener('input', applyFilters);
    document.getElementById('filterAction').addEventListener('change', applyFilters);
    document.getElementById('quickDate').addEventListener('change', handleQuickDateChange);
    document.getElementById('filterFrom').addEventListener('change', applyFilters);
    document.getElementById('filterTo').addEventListener('change', applyFilters);
});

// Data load — must wait for auth.js to finish setting up window.apiFetch
document.addEventListener('eliteAuthReady', () => {
    loadAuditLogs();
});
</script>
</body>
</html>
