<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <script src="/src/pages/auth.js" data-roles="admin,manager,cashier"></script>
    <script src="/src/pages/sidebar.js" data-active="debt_status.html"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debt Status Intelligence | Elite Hardware</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/tailwind.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
   
</head>
<body class="antialiased">

    <div class="flex min-h-screen">
        <div id="sidebarMount"></div>
        <main class="flex-1 p-4 md:p-8 h-screen overflow-y-auto custom-scrollbar">
            
<div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 no-print gap-4">
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Accounts Receivable</h1>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest mt-1">Consolidated Customer Debt Tracking</p>
                </div>
            <div class="flex gap-2 no-print">
    <button onclick="generatePDF()" class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-black text-xs uppercase shadow-lg hover:bg-slate-800 transition">
        📄 Export PDF
    </button>
    <button onclick="exportCSV()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-black text-xs uppercase shadow-lg hover:bg-emerald-700 transition">
        ⬇ Export CSV
    </button>
</div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 no-print">
                <div class="flex-1 min-w-35">
                    <label for="dateFilter" class="block text-[10px] font-black uppercase text-slate-400 mb-1 ml-1">Filter by Date</label>
                    <input type="date" id="dateFilter" onchange="fetchDebtStatus()" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 font-bold">
                </div>
                <div class="flex-1 min-w-50">
                    <label for="statusSearch" class="block text-[10px] font-black uppercase text-slate-400 mb-1">Search Customer or Phone Number</label>
                    <input type="text" id="statusSearch" onkeyup="filterStatusTable()" placeholder="Search by name or phone..." class="w-full bg-slate-50 border-none rounded-lg p-2 text-sm font-bold focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="flex items-end">
                    <button onclick="clearFilters()" class="w-full bg-slate-100 text-slate-500 p-3 rounded-xl font-black text-[10px] uppercase hover:bg-slate-200 transition">Clear</button>
                </div>
            </div>

            <div id="pdf-area">
                <div id="pdf-header" class="hidden text-center pb-6 border-b-2 border-slate-100 mb-6">
                    <h2 class="text-2xl font-black text-slate-900 uppercase tracking-tighter">Elite Hardware - Debt Status Report</h2>
                    <p class="text-xs font-bold text-slate-400 mt-1" id="genDateLabel"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-3xl border-t-4 border-red-600 shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Total Outstanding Debt</p>
                        <h2 id="totalOwed" class="text-2xl font-black text-red-600">KES 0</h2>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border-t-4 border-emerald-500 shadow-sm">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-1">Active Debtors Count</p>
                        <h2 id="debtorCount" class="text-2xl font-black text-emerald-600">0</h2>
                    </div>
                </div>

                 <div class="overflow-x-auto">
                    <table class="w-full text-left" id="statusTable">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr class="text-[10px] font-black text-slate-400 uppercase">
                                <th class="p-4">Customer Name</th>
                                <th class="p-4">Phone Identity</th>
                                <th class="p-4 text-red-600">Consolidated Balance</th>
                                <th class="p-4 text-amber-600">Credit Limit</th>
                                <th class="p-4 text-right no-print">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="statusTableBody" class="text-sm divide-y divide-slate-100">
                            <tr><td colspan="4" class="p-20 text-center text-slate-400 italic">Analyzing debt status...</td></tr>
                        </tbody>
                    </table>
                <div class="no-print" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid rgba(255,255,255,0.09);background:var(--surface,#252537);border-radius:0 0 12px 12px;">
                    <span id="lbl_ds" style="font-size:10px;font-weight:700;color:#7a8394;text-transform:uppercase;letter-spacing:1px;font-family:'Space Mono',monospace;"></span>
                    <div style="display:flex;gap:8px;">
                        <button id="prev_ds" onclick="pg_ds(-1)" style="padding:6px 16px;border-radius:8px;background:#1e1e2e;border:1px solid rgba(255,255,255,0.1);color:#d4d4d4;font-size:10px;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;" disabled>← Prev</button>
                        <button id="next_ds" onclick="pg_ds(1)"  style="padding:6px 16px;border-radius:8px;background:#1e1e2e;border:1px solid rgba(255,255,255,0.1);color:#d4d4d4;font-size:10px;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;" disabled>Next →</button>
                    </div>
                </div>
                </div>
            </div>
        </main>
    </div>

    <script>

    // XSS guard — wrap all server-sourced strings before innerHTML insertion
    function esc(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');
    }
// Fallback: ensure API vars are defined even if sidebar.js timing varies
const API_URL  = window.API_URL  || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'https://hardware-pos-backend.onrender.com/api' : '/api');
const API_BASE = window.API_BASE || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'https://hardware-pos-backend.onrender.com/api' : '/api');

function setupUserIdentity() {
            const role = window.EliteAuth?.role || 'Staff';
            const name = window.EliteAuth?.name || 'User';
            const subtitle = document.querySelector('p.text-slate-500');
            if (subtitle) subtitle.innerText = `${name} — ${role} Access`;
        }

        // Updated for uniform sidebars
async function fetchDebtStatus() {
            const role = window.EliteAuth?.role;
            const body = document.getElementById('statusTableBody');
            const dateFilter = document.getElementById('dateFilter').value; // Correctly capturing date
            
            try {
                let url = `${API_URL}/reports/debtors?role=${role}`;
                if (dateFilter) {
                    url += `&date=${dateFilter}`; // Sending date to server
                }

                const res = await apiFetch(url);
                const debtors = await res.json();

                body.innerHTML = '';
                let totalOwed = 0;

                if (!debtors || debtors.length === 0) {
                    body.innerHTML = `<tr><td colspan="4" class="p-20 text-center text-slate-400 italic">No active debtors found for this selection.</td></tr>`;
                    resetCounters();
                    return;
                }

                // compute totals from full set
                debtors.forEach(p => { totalOwed += parseFloat(p.total_debt) || 0; });
                document.getElementById('totalOwed').innerText = `KES ${totalOwed.toLocaleString()}`;
                document.getElementById('debtorCount').innerText = debtors.length;
                // paginate
                _pg_ds_set(debtors);
                document.getElementById('genDateLabel').innerText = dateFilter 
                    ? `Report for: ${dateFilter}` 
                    : `Report Date: ${new Date().toLocaleString()}`;

            } catch (err) {
                console.error("Failed to fetch debt status:", err);
                body.innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">Error connecting to server.</td></tr>`;
            }
        }

        function filterStatusTable() {
            const q = document.getElementById('statusSearch').value.toLowerCase();
            document.querySelectorAll('#statusTableBody tr').forEach(tr => {
                tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        function clearFilters() {
            document.getElementById('statusSearch').value = '';
            document.getElementById('dateFilter').value = '';
            fetchDebtStatus();
        }

        function resetCounters() {
            document.getElementById('totalOwed').innerText = 'KES 0';
            document.getElementById('debtorCount').innerText = '0';
        }

        function generatePDF() {
            const element = document.getElementById('pdf-area');
            const header = document.getElementById('pdf-header');
            header.classList.remove('hidden');
            const opt = {
                margin: 0.3,
                filename: `Elite_Debt_Report_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save().then(() => header.classList.add('hidden'));
        }
        function exportCSV() {
        if (typeof _pg_ds_all === 'undefined' || !_pg_ds_all.length) return alert('No data to export.');
        let csv = 'Customer Name,Phone,Consolidated Balance\n';
        _pg_ds_all.forEach(d => {
            const bal = parseFloat(d.total_debt) || 0;
            csv += `"${(d.name || '').replace(/"/g, '""')}","${d.phone || ''}","${bal}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Debt_Status_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
    }
document.addEventListener('eliteAuthReady', function() { 
            setupUserIdentity(); 
            fetchDebtStatus(); 
        });
    function _ds_renderRows(rows) {
    const body = document.getElementById('statusTableBody');
    const role = window.EliteAuth?.role || '';
    const canManageLimit = ['admin','manager'].includes(role.toLowerCase());
    if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-400 italic">No records on this page.</td></tr>'; return; }
    body.innerHTML = rows.map(person => {
        const balance = parseFloat(person.total_debt) || 0;
        const limit   = person.credit_limit !== null && person.credit_limit !== undefined ? parseFloat(person.credit_limit) : null;
        const blocked = limit !== null && balance >= limit;
        const limitBadge = limit === null
            ? `<span class="text-slate-400 text-xs font-bold italic">No limit</span>`
            : `<span class="text-xs font-black px-2 py-1 rounded-lg ${blocked ? 'bg-red-100 text-red-700' : 'bg-amber-50 text-amber-700'}">
                ${blocked ? '🚫 ' : ''}KES ${limit.toLocaleString()}
               </span>`;
        const setLimitBtn = canManageLimit
            ? `<button onclick="openCreditLimitModal('${esc(person.phone)}','${esc(person.name)}',${limit === null ? 'null' : limit})"
                class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase hover:bg-amber-200 transition ml-1">
                ⚙ Limit
               </button>`
            : '';
        return `<tr class="hover:bg-slate-50 transition border-b border-slate-100">
            <td class="p-4 font-black text-slate-800 uppercase text-xs">${esc(person.name)}</td>
            <td class="p-4 text-slate-500 font-bold">${esc(person.phone)}</td>
            <td class="p-4 text-red-600 font-black">KES ${balance.toLocaleString()}</td>
            <td class="p-4">${limitBadge}</td>
            <td class="p-4 text-right no-print flex justify-end gap-1 flex-wrap">
                <button onclick="window.location.href='/debts_repayment?phone=${encodeURIComponent(person.phone || '')}&name=${encodeURIComponent(person.name || '')}'"
                    class="bg-slate-900 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase hover:bg-emerald-600 transition shadow-sm">
                    View History
                </button>
                ${setLimitBtn}
            </td>
        </tr>`;
    }).join('');
}
// ── Pagination [ds] ────────────────────────────────────────
let _pg_ds_all  = [];
let _pg_ds_page = 1;
function _pg_ds_set(data) {
    _pg_ds_all  = data;
    _pg_ds_page = 1;
    _pg_ds_draw();
}
function _pg_ds_draw() {
    const total = _pg_ds_all.length;
    const pages = Math.ceil(total / 10) || 1;
    const slice = _pg_ds_all.slice((_pg_ds_page-1)*10, _pg_ds_page*10);
    const lbl   = document.getElementById('lbl_ds');
    const prev  = document.getElementById('prev_ds');
    const nxt   = document.getElementById('next_ds');
    if(lbl)  lbl.textContent  = 'Page '+_pg_ds_page+' of '+pages+' — '+total+' record(s)';
    if(prev) prev.disabled    = _pg_ds_page <= 1;
    if(nxt)  nxt.disabled     = _pg_ds_page >= pages;
    _ds_renderRows(slice);
}
function pg_ds(dir) {
    const pages = Math.ceil(_pg_ds_all.length / 10) || 1;
    _pg_ds_page = Math.max(1, Math.min(pages, _pg_ds_page + dir));
    _pg_ds_draw();
}

// ── Credit Limit Modal ─────────────────────────────────────────────────────
function openCreditLimitModal(phone, name, currentLimit) {
    const existing = document.getElementById('creditLimitModal');
    if (existing) existing.remove();
    const limitDisplay = (currentLimit === null || currentLimit === 'null') ? '' : currentLimit;
    const modal = document.createElement('div');
    modal.id = 'creditLimitModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    modal.innerHTML = `
        <div style="background:white;border-radius:20px;padding:28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div>
                    <h3 style="font-size:16px;font-weight:900;color:#0f172a;text-transform:uppercase;letter-spacing:0.5px;">Set Credit Limit</h3>
                    <p style="font-size:11px;color:#64748b;font-weight:700;margin-top:2px;">${name} · ${phone}</p>
                </div>
                <button onclick="document.getElementById('creditLimitModal').remove()" style="background:#f1f5f9;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:900;color:#64748b;font-size:16px;">✕</button>
            </div>
            <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:11px;color:#92400e;font-weight:700;">
                ⚠ Credit sales will be blocked once this customer's debt reaches this amount. Leave blank to remove the limit (unlimited credit).
            </div>
            <label style="display:block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin-bottom:6px;">Credit Limit (KES)</label>
            <input id="clLimitInput" type="number" min="0" placeholder="e.g. 5000 — blank = no limit"
                value="${limitDisplay}"
                style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-weight:700;outline:none;box-sizing:border-box;"
                onfocus="this.style.borderColor='#f59e0b'" onblur="this.style.borderColor='#e2e8f0'">
            <div id="clError" style="display:none;color:#dc2626;font-size:11px;font-weight:700;margin-top:6px;"></div>
            <div style="display:flex;gap:8px;margin-top:16px;">
                <button onclick="saveCreditLimit('${phone}')"
                    style="flex:1;background:#0f172a;color:white;border:none;padding:12px;border-radius:12px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;letter-spacing:1px;">
                    ✓ Save
                </button>
                <button onclick="saveCreditLimit('${phone}', true)"
                    style="background:#fee2e2;color:#dc2626;border:none;padding:12px 16px;border-radius:12px;font-weight:900;font-size:11px;text-transform:uppercase;cursor:pointer;">
                    🗑 Remove Limit
                </button>
            </div>
        </div>`;
    document.body.appendChild(modal);
    setTimeout(() => document.getElementById('clLimitInput')?.focus(), 50);
}

async function saveCreditLimit(phone, remove) {
    const errEl = document.getElementById('clError');
    errEl.style.display = 'none';
    const raw   = document.getElementById('clLimitInput')?.value?.trim();
    const value = remove ? null : (raw === '' ? null : parseFloat(raw));
    if (!remove && raw !== '' && (isNaN(value) || value < 0)) {
        errEl.textContent = 'Enter a valid positive number or leave blank to remove the limit.';
        errEl.style.display = 'block'; return;
    }
    try {
        const res  = await apiFetch(`${API_URL}/customers/${encodeURIComponent(phone)}/credit-limit`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credit_limit: value })
        });
        const data = await res.json();
        if (!res.ok || !data.success) { errEl.textContent = data.message || 'Failed.'; errEl.style.display = 'block'; return; }
        document.getElementById('creditLimitModal').remove();
        fetchDebtStatus();
    } catch(e) {
        errEl.textContent = 'Server error. Please try again.'; errEl.style.display = 'block';
    }
}
</script>
</body>
</html>
